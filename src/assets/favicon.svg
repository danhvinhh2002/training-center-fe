<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40a9ff"/>
      <stop offset="50%" stop-color="#1890ff"/>
      <stop offset="100%" stop-color="#096dd9"/>
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#002766" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Nền bo góc xanh dương hiện đại -->
  <rect width="64" height="64" rx="14" fill="url(#eduGrad)"/>
  
  <!-- Biểu tượng Mũ Cử nhân (Giáo dục & Đào tạo) -->
  <g filter="url(#capShadow)">
    <!-- Đỉnh mũ dạng hình thoi -->
    <polygon points="32,15 54,25 32,35 10,25" fill="#ffffff"/>
    
    <!-- Vành mũ ôm đầu -->
    <path d="M19,29.5 L19,38 C19,43.2 24.8,47 32,47 C39.2,47 45,43.2 45,38 L45,29.5 L32,35.5 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Dây tua rua màu vàng nổi bật -->
    <path d="M47,28 L47,40.5 C47,42 45.5,43 45,43.5" stroke="#ffd666" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="44" r="2.2" fill="#faad14"/>
  </g>
</svg>
